version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: journalscope-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "JournalScope2025!"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - journalscope-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # JournalScope - Sistema Principal
  journalscope:
    image: periodicos:6v
    container_name: journalscope-v6
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VITE_APP_TITLE=JournalScope
      - VITE_APP_VERSION=6.0.0
      - VITE_SUB_SYSTEM_URL=http://localhost:8081
    restart: unless-stopped
    volumes:
      - logs-nginx:/var/log/nginx
    networks:
      - journalscope-network

  # Sistema SUB - Gestão de Submissões
  sub-system:
    image: sub-system:1v
    container_name: sub-system-v1
    ports:
      - "8081:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/db/custom.db
      - PORT=3001
      - REDIS_URL=redis://:JournalScope2025!@redis:6379
    restart: unless-stopped
    volumes:
      - sub-db:/app/prisma/db
      - sub-logs:/app/logs
    networks:
      - journalscope-network
    depends_on:
      - journalscope
      - redis

  # Nginx Reverse Proxy (Opcional)
  nginx-proxy:
    image: nginx:alpine
    container_name: journalscope-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-production.conf:/etc/nginx/conf.d/default.conf
      - nginx-logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - journalscope-network
    depends_on:
      - journalscope
      - sub-system

volumes:
  logs-nginx:
  sub-db:
  sub-logs:
  nginx-logs:
  redis-data:

networks:
  journalscope-network:
    driver: bridge
